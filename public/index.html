<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vidora 1.2</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0f0f0f;color:#f5f5f5;font:15px Arial,sans-serif}
header{height:64px;background:#111;display:flex;align-items:center;gap:18px;padding:0 20px;position:sticky;top:0;z-index:10;border-bottom:1px solid #252525}
.logo{font-size:22px;font-weight:800;color:#ff3b30}.logo span{color:#fff}
.search{display:flex;max-width:720px;flex:1;margin:auto}
.search input{flex:1;background:#181818;border:1px solid #444;color:#fff;padding:12px 16px;border-radius:24px 0 0 24px;outline:none}
.search button{width:60px;background:#292929;color:#fff;border:1px solid #444;border-left:0;border-radius:0 24px 24px 0}
button{cursor:pointer}
.gear{background:transparent;border:0;color:#fff;font-size:21px;padding:8px}
.side{width:220px;position:fixed;top:64px;bottom:0;background:#111;padding:18px 10px}
.nav{display:block;color:#ddd;text-decoration:none;padding:12px 14px;border-radius:9px;margin-bottom:4px}
.nav:hover,.nav.active{background:#272727}
main{margin-left:220px;padding:24px;width:calc(100% - 220px)}
h1{font-size:25px}
.chips{display:flex;gap:9px;overflow:auto;margin-bottom:20px}
.chip{border:0;background:#292929;color:#fff;padding:9px 14px;border-radius:18px;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:28px 17px}
.card{cursor:pointer}.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:9px;background:#222}
.title{font-weight:700;line-height:1.35;margin:9px 0 5px}.meta{color:#999;font-size:13px;line-height:1.4}
.loading,.empty{text-align:center;padding:70px;color:#999}
.playerPage{display:none}.back{background:#292929;color:#fff;border:0;border-radius:8px;padding:10px 14px;margin-bottom:16px}
.player{width:100%;aspect-ratio:16/9;background:#000;border:0;border-radius:9px}
.videoTitle{font-size:23px;font-weight:700;margin:17px 0 6px}
.description{background:#1d1d1d;border-radius:9px;padding:16px;margin-top:15px;white-space:pre-wrap;line-height:1.5;color:#ddd}
.status{position:fixed;right:15px;bottom:15px;background:#1b1b1b;border:1px solid #333;border-radius:8px;padding:8px 12px;color:#aaa;font-size:12px}
.modal{display:none;position:fixed;inset:0;background:#000b;z-index:50;align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}.box{width:min(760px,100%);max-height:85vh;overflow:auto;background:#1c1c1c;border:1px solid #444;border-radius:14px;padding:22px}
.box h2{margin-top:0}.box p{color:#aaa;line-height:1.5}
.add{display:flex;gap:8px;margin:15px 0}.add input{flex:1;background:#111;border:1px solid #555;color:#fff;padding:11px;border-radius:8px}
.add button,.save{background:#fff;color:#111;border:0;border-radius:8px;padding:10px 14px;font-weight:700}
.inst{display:flex;align-items:center;gap:8px;background:#111;padding:11px;border-radius:8px;margin:7px 0}
.dot{width:9px;height:9px;border-radius:50%;background:#777;flex:none}.dot.ok{background:#55d66b}.dot.bad{background:#e65353}
.inst span{flex:1;word-break:break-all;color:#ddd}.small{background:#292929;color:#fff;border:0;padding:7px 9px;border-radius:6px}
.remove{background:#3a1f1f;color:#ffaaa0}.notice{display:none;padding:11px;border-radius:8px;margin:10px 0;background:#252515;border:1px solid #55552a;color:#eee}
@media(max-width:800px){.side{display:none}main{margin-left:0;width:100%;padding:15px}.grid{grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:20px 10px}header{padding:0 10px}.logo{font-size:18px}}
</style>
</head>
<body>

<header>
<div class="logo">VID<span>ORA</span></div>
<form class="search" id="searchForm">
<input id="q" placeholder="Videos suchen …">
<button>⌕</button>
</form>
<button class="gear" onclick="openSettings()">⚙</button>
</header>

<aside class="side">
<a class="nav active" href="#" onclick="home();return false">⌂ &nbsp; Startseite</a>
<a class="nav" href="#" onclick="trending();return false">🔥 &nbsp; Trends</a>
<a class="nav" href="#" onclick="openSettings();return false">⚙ &nbsp; Instanzen</a>
</aside>

<main>
<section id="home">
<div class="chips">
<button class="chip" onclick="search('Musik')">Musik</button>
<button class="chip" onclick="search('Gaming')">Gaming</button>
<button class="chip" onclick="search('Technologie')">Technologie</button>
<button class="chip" onclick="search('Sport')">Sport</button>
</div>
<h1 id="heading">Empfehlungen</h1>
<div id="grid" class="grid"></div>
</section>

<section id="playerPage">
<button class="back" onclick="showHome()">← Zurück</button>
<iframe id="player" class="player" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture"></iframe>
<div id="vtitle" class="videoTitle"></div>
<div id="vmeta" class="meta"></div>
<div id="vdesc" class="description"></div>
</section>
</main>

<div class="status">Invidious: <span id="status">–</span></div>

<div class="modal" id="modal">
<div class="box">
<h2>⚙ Invidious-Instanzen</h2>
<p>
Eine Instanz wird beim Hinzufügen gespeichert. Version 1.2 verwendet mehrere
Kompatibilitätstests und behandelt einen 404 beim Testen nicht mehr als Fehler
beim Hinzufügen.
</p>

<div class="add">
<input id="newInstance" placeholder="https://invidious.example.com">
<button onclick="addInstance()">Hinzufügen</button>
</div>

<div id="notice" class="notice"></div>
<div id="instances"></div>

<br>
<button class="save" onclick="closeSettings()">Fertig</button>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
const grid=$("grid");

async function api(url,options={}){
  let response;
  try{
    response=await fetch(url,options);
  }catch{
    throw new Error("Backend nicht erreichbar. Bitte 'npm start' ausführen.");
  }

  let data={};
  try{data=await response.json()}catch{}

  if(!response.ok){
    throw new Error(data.error||data.details||("HTTP "+response.status));
  }

  return data;
}

function esc(value=""){
  return String(value).replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

function thumbnail(v){
  return v.videoThumbnails?.find(x=>x.quality==="medium")?.url ||
         v.videoThumbnails?.[0]?.url ||
         `https://i.ytimg.com/vi/${v.videoId}/hqdefault.jpg`;
}

function card(v){
  return `
  <article class="card" onclick="openVideo('${esc(v.videoId)}')">
    <img class="thumb" src="${esc(thumbnail(v))}" loading="lazy"
         onerror="this.src='https://i.ytimg.com/vi/${esc(v.videoId)}/hqdefault.jpg'">
    <div class="title">${esc(v.title||"Unbekanntes Video")}</div>
    <div class="meta">${esc(v.author||"")}
    ${v.viewCount?"<br>"+Number(v.viewCount).toLocaleString("de-DE")+" Aufrufe":""}</div>
  </article>`;
}

function setStatus(instance){
  try{$("status").textContent=new URL(instance).host}
  catch{$("status").textContent=instance||"–"}
}

async function load(url,title){
  $("heading").textContent=title;
  grid.innerHTML='<div class="loading">Lade Videos …</div>';

  try{
    const result=await api(url);
    setStatus(result.instance);

    const videos=(result.data||[]).filter(x=>x.type==="video");

    grid.innerHTML=videos.length
      ? videos.map(card).join("")
      : '<div class="empty">Keine Videos gefunden.</div>';
  }catch(error){
    grid.innerHTML=`<div class="empty">${esc(error.message)}</div>`;
    $("status").textContent="Fehler";
  }
}

function home(){
  showHome();
  load("/api/trending","Empfehlungen");
}

function trending(){
  showHome();
  load("/api/trending","Trends");
}

function search(query){
  showHome();
  const q=query||$("q").value.trim();
  if(!q)return home();
  load("/api/search?q="+encodeURIComponent(q),"Suchergebnisse für „"+q+"“");
}

$("searchForm").addEventListener("submit",e=>{
  e.preventDefault();
  search();
});

async function openVideo(id){
  $("home").style.display="none";
  $("playerPage").style.display="block";
  $("player").src="";
  $("vtitle").textContent="Video wird geladen …";

  try{
    const result=await api("/api/video/"+encodeURIComponent(id));
    setStatus(result.instance);

    const v=result.data;

    $("vtitle").textContent=v.title||"";
    $("vmeta").textContent=(v.author||"")+
      (v.viewCount?" · "+Number(v.viewCount).toLocaleString("de-DE")+" Aufrufe":"");
    $("vdesc").textContent=v.description||"Keine Beschreibung.";

    $("player").src=result.instance+"/embed/"+encodeURIComponent(id);
  }catch(error){
    $("vtitle").textContent="Video konnte nicht geladen werden.";
    $("vdesc").textContent=error.message;
    $("status").textContent="Fehler";
  }
}

function showHome(){
  $("playerPage").style.display="none";
  $("home").style.display="block";
}

async function openSettings(){
  $("modal").classList.add("open");
  await refreshInstances();
}

function closeSettings(){
  $("modal").classList.remove("open");
}

function notice(message){
  const el=$("notice");
  el.textContent=message;
  el.style.display="block";
  setTimeout(()=>el.style.display="none",7000);
}

async function refreshInstances(){
  try{
    const result=await api("/api/instances");

    $("instances").innerHTML=result.instances.map(x=>`
      <div class="inst">
        <i class="dot ${x.ok?"ok":"bad"}"></i>
        <span>${esc(x.url)}</span>
        <button class="small" onclick="checkInstance('${esc(x.url)}')">Prüfen</button>
        <button class="small remove" onclick="removeInstance('${esc(x.url)}')">Löschen</button>
      </div>
    `).join("");
  }catch(error){
    notice(error.message);
  }
}

async function addInstance(){
  const input=$("newInstance");
  const url=input.value.trim();

  if(!url){
    notice("Bitte eine URL eingeben.");
    return;
  }

  try{
    const result=await api("/api/instances",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({url})
    });

    input.value="";
    await refreshInstances();

    if(result.reachable){
      notice("✓ Instanz hinzugefügt und kompatibel.");
    }else{
      notice("✓ Instanz gespeichert. Sie ist momentan nicht erreichbar oder nicht kompatibel.");
    }
  }catch(error){
    notice("Fehler: "+error.message);
  }
}

async function removeInstance(url){
  if(!confirm("Instanz wirklich entfernen?"))return;

  try{
    await api("/api/instances",{
      method:"DELETE",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({url})
    });

    await refreshInstances();
  }catch(error){
    notice(error.message);
  }
}

async function checkInstance(url){
  try{
    const result=await api("/api/instances/check",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({url})
    });

    notice("✓ Instanz erreichbar (API "+result.api+").");
  }catch(error){
    notice("✕ Instanz nicht erreichbar: "+error.message);
  }

  await refreshInstances();
}

home();
</script>
</body>
</html>
