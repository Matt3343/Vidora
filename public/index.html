<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vidora</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0f0f0f;color:#eee;font:15px Arial}header{height:64px;background:#111;display:flex;align-items:center;gap:18px;padding:0 20px;position:sticky;top:0;z-index:5;border-bottom:1px solid #252525}.logo{font-size:22px;font-weight:800;color:#f33}.logo span{color:white}.search{display:flex;flex:1;max-width:720px;margin:auto}.search input{flex:1;background:#181818;color:white;border:1px solid #444;padding:12px 16px;border-radius:24px 0 0 24px}.search button{width:60px;background:#292929;color:white;border:1px solid #444;border-radius:0 24px 24px 0}.gear{background:none;border:0;color:white;font-size:21px}.side{position:fixed;top:64px;bottom:0;width:220px;background:#111;padding:18px 10px}.nav{display:block;color:#ddd;text-decoration:none;padding:12px 14px;border-radius:9px;margin-bottom:4px}.nav:hover{background:#272727}main{margin-left:220px;padding:24px;width:calc(100% - 220px)}.chips{display:flex;gap:9px;overflow:auto;margin-bottom:20px}.chip{border:0;background:#292929;color:#fff;padding:9px 14px;border-radius:18px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:28px 17px}.card{cursor:pointer}.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:9px;background:#222}.title{font-weight:bold;line-height:1.35;margin:9px 0 5px}.meta{color:#999;font-size:13px;line-height:1.4}.loading,.empty{text-align:center;padding:70px;color:#999}.playerPage{display:none}.back{background:#292929;color:white;border:0;border-radius:8px;padding:10px 14px;margin-bottom:16px}.player{width:100%;aspect-ratio:16/9;background:#000;border:0;border-radius:9px}.videoTitle{font-size:23px;font-weight:bold;margin:17px 0 6px}.description{background:#1d1d1d;border-radius:9px;padding:16px;margin-top:15px;white-space:pre-wrap;line-height:1.5}.status{position:fixed;right:15px;bottom:15px;background:#1b1b1b;border:1px solid #333;border-radius:8px;padding:8px 12px;color:#aaa;font-size:12px}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:20;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.box{width:min(720px,100%);max-height:85vh;overflow:auto;background:#1c1c1c;border:1px solid #444;border-radius:14px;padding:22px}.add{display:flex;gap:8px;margin:15px 0}.add input{flex:1;background:#111;border:1px solid #555;color:white;padding:11px;border-radius:8px}.add button,.save{background:white;color:#111;border:0;border-radius:8px;padding:10px 14px;font-weight:bold}.inst{display:flex;align-items:center;gap:8px;background:#111;padding:11px;border-radius:8px;margin:7px 0}.dot{width:9px;height:9px;border-radius:50%;background:#777}.dot.ok{background:#55d66b}.dot.bad{background:#e65353}.inst span{flex:1;word-break:break-all}.small{background:#292929;color:#fff;border:0;padding:7px 9px;border-radius:6px}.remove{background:#3a1f1f;color:#ffaaa0}.notice{display:none;background:#2b2415;border:1px solid #5b4b24;color:#e7d69a;padding:11px;border-radius:8px;margin:10px 0}@media(max-width:800px){.side{display:none}main{margin-left:0;width:100%;padding:15px}.grid{grid-template-columns:repeat(auto-fill,minmax(165px,1fr))}header{padding:0 10px}}
</style></head><body>
<header><div class="logo">VID<span>ORA</span></div><form class="search" id="sf"><input id="q" placeholder="Videos suchen …"><button>⌕</button></form><button class="gear" onclick="settings()">⚙</button></header>
<aside class="side"><a class="nav" href="#" onclick="home();return false">⌂ &nbsp; Startseite</a><a class="nav" href="#" onclick="trend();return false">🔥 &nbsp; Trends</a><a class="nav" href="#" onclick="settings();return false">⚙ &nbsp; Instanzen</a></aside>
<main><section id="home"><div class="chips"><button class="chip" onclick="search('Musik')">Musik</button><button class="chip" onclick="search('Gaming')">Gaming</button><button class="chip" onclick="search('Technologie')">Technologie</button><button class="chip" onclick="search('Sport')">Sport</button></div><h1 id="h">Empfehlungen</h1><div id="grid" class="grid"></div></section>
<section id="vp" class="playerPage"><button class="back" onclick="showHome()">← Zurück</button><iframe id="player" class="player" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture"></iframe><div id="vt" class="videoTitle"></div><div id="vm" class="meta"></div><div id="vd" class="description"></div></section></main>
<div class="status">Invidious: <span id="status">–</span></div>
<div class="modal" id="modal"><div class="box"><h2>⚙ Invidious-Instanzen</h2><p style="color:#aaa">Beim Ausfall einer Instanz wird automatisch die nächste ausprobiert.</p><div class="add"><input id="new" placeholder="https://example.com"><button onclick="add()">Hinzufügen</button></div><div id="notice" class="notice"></div><div id="list"></div><br><button class="save" onclick="closeSettings()">Fertig</button></div></div>
<script>
const $=id=>document.getElementById(id),grid=$("grid");
async function api(u,o={}){let r;try{r=await fetch(u,o)}catch(e){throw Error("Backend nicht erreichbar. Starte 'npm start'.")}let j={};try{j=await r.json()}catch{}if(!r.ok)throw Error(j.error||j.details||("HTTP "+r.status));return j}
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const img=v=>v.videoThumbnails?.find(x=>x.quality==="medium")?.url||v.videoThumbnails?.[0]?.url||`https://i.ytimg.com/vi/${v.videoId}/hqdefault.jpg`;
function card(v){return `<article class="card" onclick="video('${esc(v.videoId)}')"><img class="thumb" src="${esc(img(v))}" loading="lazy" onerror="this.src='https://i.ytimg.com/vi/${esc(v.videoId)}/hqdefault.jpg'"><div class="title">${esc(v.title||"Unbekanntes Video")}</div><div class="meta">${esc(v.author||"")}${v.viewCount?"<br>"+Number(v.viewCount).toLocaleString("de-DE")+" Aufrufe":""}</div></article>`}
function setStatus(x){try{$("status").textContent=new URL(x).host}catch{$("status").textContent=x||"–"}}
async function load(url,title){$("h").textContent=title;grid.innerHTML='<div class="loading">Lade …</div>';try{let j=await api(url);setStatus(j.instance);let a=(j.data||[]).filter(x=>x.type==="video");grid.innerHTML=a.length?a.map(card).join(""):'<div class="empty">Keine Videos gefunden.</div>'}catch(e){grid.innerHTML=`<div class="empty">${esc(e.message)}</div>`;$("status").textContent="Fehler"}}
function home(){showHome();load("/api/trending","Empfehlungen")}function trend(){showHome();load("/api/trending","Trends")}
function search(q){showHome();q=q||$("q").value.trim();if(q)load("/api/search?q="+encodeURIComponent(q),"Suchergebnisse für „"+q+"“")}
$("sf").onsubmit=e=>{e.preventDefault();search()}
async function video(id){$("home").style.display="none";$("vp").style.display="block";$("player").src="";try{let j=await api("/api/video/"+encodeURIComponent(id));setStatus(j.instance);let v=j.data;$("vt").textContent=v.title||"";$("vm").textContent=(v.author||"")+(v.viewCount?" · "+Number(v.viewCount).toLocaleString("de-DE")+" Aufrufe":"");$("vd").textContent=v.description||"Keine Beschreibung.";$("player").src=j.instance+"/embed/"+encodeURIComponent(id)}catch(e){$("vt").textContent="Video konnte nicht geladen werden.";$("vd").textContent=e.message}}
function showHome(){$("vp").style.display="none";$("home").style.display="block"}
async function settings(){$("modal").classList.add("open");await refresh()}
function closeSettings(){$("modal").classList.remove("open")}
function notice(x){$("notice").textContent=x;$("notice").style.display="block";setTimeout(()=>$("notice").style.display="none",6000)}
async function refresh(){try{let j=await api("/api/instances");$("list").innerHTML=j.instances.map(x=>`<div class="inst"><i class="dot ${x.ok?"ok":"bad"}"></i><span>${esc(x.url)}</span><button class="small" onclick="check('${esc(x.url)}')">Prüfen</button><button class="small remove" onclick="removeI('${esc(x.url)}')">Löschen</button></div>`).join("")}catch(e){notice(e.message)}}
async function add(){let input=$("new"),url=input.value.trim();if(!url)return notice("Bitte eine URL eingeben.");try{let j=await api("/api/instances",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({url})});input.value="";await refresh();notice(j.reachable?"Instanz hinzugefügt und erreichbar.":(j.warning||"Instanz gespeichert, aber nicht erreichbar."))}catch(e){notice(e.message)}}
async function removeI(url){if(!confirm("Instanz wirklich entfernen?"))return;try{await api("/api/instances",{method:"DELETE",headers:{"Content-Type":"application/json"},body:JSON.stringify({url})});refresh()}catch(e){notice(e.message)}}
async function check(url){try{await api("/api/instances/check",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({url})});notice("Instanz ist erreichbar.")}catch(e){notice("Nicht erreichbar: "+e.message)}refresh()}
home();
</script></body></html>
